    <style>
        /* ================= CSS VARIABLES ================= */
        :root {
            --primary-color: #517668;
            --primary-hover: #3d5a4e;
            --bg-glass: rgba(255, 255, 255, 0.65);
            --bg-dark-glass: rgba(0, 0, 0, 0.7);
            --text-dark: #333;
            --text-light: #fff;
            --border-radius: 12px;
            --transition-speed: 0.3s;
        }

        /* ================= GLOBAL ================= */
        body {
            font-family: 'Cairo', sans-serif;
            background-image: url('style/images/back6.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ================= LOGOS ================= */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0 15px;
            width: 100%;
        }
        .logo-container img {
            height: 75px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            transition: transform var(--transition-speed);
        }
        .logo-container img:hover {
            transform: translateY(-5px);
        }

        /* ================= MAIN CONTAINER (Glassmorphism) ================= */
        .container {
            width: 95%;
            max-width: 800px;
            margin: 15px auto;
            padding: 30px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .container h2 {
            color: var(--primary-color);
            font-weight: 900;
            font-size: 26px;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        /* ================= FORM INPUTS ================= */
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .input-control {
            width: 100%;
            max-width: 450px;
            padding: 14px;
            border: 2px solid rgba(81, 118, 104, 0.4);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            color: var(--text-dark);
            text-align: center;
            transition: all var(--transition-speed);
        }

        .input-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(81, 118, 104, 0.3);
            background: #fff;
        }

        select.input-control {
            appearance: none;
            cursor: pointer;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23517668%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: left 15px top 50%;
            background-size: 12px auto;
        }

        .btn-submit {
            width: 100%;
            max-width: 450px;
            padding: 14px;
            background: var(--primary-color);
            color: var(--text-light);
            border: none;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            transition: background var(--transition-speed), transform 0.1s;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            box-shadow: 0 5px 15px rgba(81, 118, 104, 0.4);
        }
        
        .btn-submit:active {
            transform: scale(0.98);
        }

        /* ================= INFO WIDGETS (Counter & Footer) ================= */
        .info-bar {
            width: 95%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: var(--bg-dark-glass);
            color: var(--text-light);
            font-weight: 800;
            padding: 12px;
            border-radius: var(--border-radius);
            margin: 20px auto 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .info-bar i { color: gold; }

        .footer {
            width: 95%;
            max-width: 800px;
            margin: 0 auto 30px;
            padding: 20px;
            text-align: center;
            color: var(--text-light);
            background: var(--bg-dark-glass);
            border-top: 3px solid var(--primary-color);
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .footer p {
            margin: 8px 0;
            font-size: 14px;
            font-weight: 700;
        }

        .footer a {
            display: inline-block;
            margin-top: 10px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            transition: var(--transition-speed);
        }
        
        .footer a:hover {
            background: rgba(255,255,255,0.2);
            color: gold;
        }

        .developer-credit {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
            color: #ccc;
        }

        .developer-credit span {
            color: gold;
            font-weight: bold;
        }

        /* ================= MEDIA QUERIES ================= */
        @media (max-width: 768px) {
            .logo-container img { height: 60px; }
            .container { padding: 20px; }
            .container h2 { font-size: 22px; }
            .input-control, .btn-submit { font-size: 15px; padding: 12px; }
        }

        @media (max-width: 480px) {
            .logo-container img { height: 45px; }
            .container h2 { font-size: 20px; }
            .info-bar, .footer { font-size: 12px; }
        }
    </style>
